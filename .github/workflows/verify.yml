name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-service.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py'
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path harness/Cargo.toml
  shared-and-ios:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      COMPANION_IOS_PACKAGES: ${{ runner.temp }}/companion-ios-packages
      COMPANION_IOS_DERIVED_DATA: ${{ runner.temp }}/companion-ios-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          xcodebuild -version
          swift --version
          if ! xcrun metal --version >/dev/null 2>&1; then xcodebuild -downloadComponent MetalToolchain; fi
          xcodebuild -resolvePackageDependencies -project ios/OpenAICompanion.xcodeproj -scheme OpenAICompanion -clonedSourcePackagesDirPath "$COMPANION_IOS_PACKAGES"
      - run: cargo build --locked --release --manifest-path harness/Cargo.toml
      - run: rustup target add aarch64-apple-ios-sim aarch64-apple-darwin
      - run: ./scripts/ios-llama.sh
      - run: ./scripts/test-ios-prompt.sh
      - run: ./scripts/test-ios-mlx-values.sh
      - run: bash ./scripts/test-ios-download.sh
      - run: ./scripts/test-ios-mlx-parser.sh "$COMPANION_IOS_PACKAGES/checkouts/mlx-swift-lm"
      - working-directory: kmp
        env:
          HARNESS_LIBRARY_PATH: ${{ github.workspace }}/harness/target/release/libharness.dylib
        run: ./gradlew -PkmpJvmToolchain=21 -PskipAndroidApp=true jvmTest :iosApp:compileKotlinIosSimulatorArm64
      - run: ./scripts/ios-app-check.sh
      - run: ./scripts/test-ios-ui.sh
        timeout-minutes: 10
      - run: ./scripts/macos-app.sh package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-report
          path: kmp/build/reports/tests/jvmTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ui-test-results
          path: ${{ runner.temp }}/companion-ios-build/Logs/Test
          if-no-files-found: ignore
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - run: ./scripts/android-llama.sh
      - working-directory: kmp
        run: ./gradlew -PkmpJvmToolchain=21 :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: kmp/androidApp/build/outputs/apk/debug/*.apk
