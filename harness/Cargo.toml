[package]
name = "harness"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[features]
cli = ["uniffi/cli"]

[dependencies]
async-trait = "0.1"
futures = "0.3"
futures-timer = "3"
uniffi = "0.29"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }
