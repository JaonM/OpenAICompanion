[package]
name = "harness"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[features]
cli = ["uniffi/cli"]

[dependencies]
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
uniffi = "0.29"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }
